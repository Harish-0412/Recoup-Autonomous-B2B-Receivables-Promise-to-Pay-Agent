[project]
name = "recoup"
version = "0.1.0"
description = "Autonomous B2B Receivables & Promise-to-Pay Agent"
readme = "README.md"
requires-python = ">=3.11"

# This file is the single source of truth for dependencies. There is no
# requirements.txt: two lists that must agree is one list that eventually
# does not, which is exactly the drift that made a clean clone uninstallable.
#
# Floors, not exact pins. Several of the previous exact pins were pinning
# *broken* versions (see the notes below), and a floor that encodes the known
# bad boundary survives a routine upgrade in a way a pin does not. Reproducible
# builds come from a lockfile generated on top of this, not from these ranges.
dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",

    # --- data ---
    # psycopg, not asyncpg: app.core.config normalises every URL to
    # postgresql+psycopg, so asyncpg was never the driver actually loaded --
    # importing app.models on a clean install raised ModuleNotFoundError.
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    # aiosqlite: the async driver for local SQLite URLs
    # (sqlite:///... -> sqlite+aiosqlite:///... in database_url_async).
    # Without it every dev/test run on SQLite raises ModuleNotFoundError.
    "aiosqlite>=0.20",
    # SQLAlchemy's asyncio bridge needs greenlet at runtime. It arrives
    # transitively today; naming it means an upgrade cannot quietly drop it.
    "greenlet>=3.0",
    "alembic>=1.14",

    # --- shared state ---
    # redis + hiredis parser: shared sliding-window rate limiter across replicas.
    # Opt-in via RATE_LIMIT_REDIS_URL; missing URL falls back to in-process deque.
    "redis[hiredis]>=5.0",

    # --- observability (OpenTelemetry) ---
    # Opt-in via OTEL_EXPORTER_OTLP_ENDPOINT. Without the endpoint, traces go
    # to stdout JSON (ConsoleSpanExporter) so local dev works without an account.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b1",
    "opentelemetry-instrumentation-logging>=0.48b1",
    "opentelemetry-instrumentation-httpx>=0.48b1",

    # --- config ---
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",

    # --- agent loop ---
    # instructor:     validated, retry-on-failure structured LLM output.
    # transitions:    escalation-ladder FSM; the library enforces the guards.
    # business-rules: policy rules as data rather than nested ifs.
    "instructor>=1.16",
    "transitions>=0.9",
    "business-rules>=1.1",
    "dateparser>=1.2",

    # eventsourcing:  aggregate event store, snapshotting, and time-travel replay.
    "eventsourcing>=9.5",

    # --- integrations ---
    # razorpay must stay >=2.0: 1.4.x imports pkg_resources, which modern
    # setuptools no longer provides, so `import razorpay` raises outright.
    "razorpay>=2.0",
    # groq must stay >=1.7: 0.6.0 passes `proxies=` to httpx, which httpx>=0.28
    # removed, so constructing a client raises TypeError.
    "groq>=1.7",
    "resend>=2.4",
    "google-generativeai>=0.8.3",
    "httpx>=0.28",

    # --- logging ---
    "structlog>=24.4",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
# The trained recovery scorer and reply classifier. Kept out of the base
# install so the API container does not carry ~500MB of ML wheels it never
# imports: app.core.agent degrades to the rules-based scorer when these are
# absent, which is the documented behaviour.
ml = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.3",
    "sdv>=1.38",
    # xlrd parses the UCI drift-training source (.xls) in
    # scripts/train_drift_model.py. Training-time only: the API container
    # never imports it (drift inference loads a joblib artifact).
    "xlrd>=2.0",
]

# Depends on the ml extra on purpose: tests/ml/ imports sklearn, xgboost and
# shap directly, so a dev install that omitted them would collect-error.
dev = [
    "recoup[ml]",
    "pytest>=8.2",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0",
    "ruff==0.7.1",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Both roots are packaged explicitly. Without this, setuptools auto-discovery
# reads src/ as a src-layout root and installs "ml" and "data" as top-level
# packages, which is not how this project imports them.
[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501", "B008"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Third-party packages that ship no type information. Listing them here is the
# difference between mypy reporting our bugs and mypy reporting their absence.
[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "pydantic.*",
    "fastapi.*",
    "sklearn.*",
    "pandas.*",
    "shap.*",
    "xgboost.*",
    "joblib.*",
    "dateparser.*",
    "groq.*",
    "google.*",
    "razorpay.*",
    "resend.*",
    "instructor.*",
    "transitions.*",
    "business_rules.*",
    "eventsourcing.*",
    "sdv.*",
    "sdmetrics.*",
]
ignore_missing_imports = true

# numpy's bundled stubs use PEP 695 `type` statements, which mypy only parses
# when targeting 3.12+. This project targets 3.11, and instructor pulls numpy
# into the type-check graph, so skip analysing those stubs rather than lowering
# the target for the whole codebase.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app", "src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
