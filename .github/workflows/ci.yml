name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets defensively
        shell: bash
        run: |
          for var in TASK_API_KEY API_KEY RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET RESEND_API_KEY RESEND_WEBHOOK_SECRET REPLY_ADDRESS_SECRET GROQ_API_KEY GEMINI_API_KEY OTEL_EXPORTER_OTLP_HEADERS; do
            val="${!var}"
            if [ -n "$val" ]; then echo "::add-mask::$val"; fi
          done

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.7.1

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and extract gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks

      # .gitleaks.toml allowlists only the deterministic fixtures (test
      # key-id placeholders, the committed mypy cache); everything else that
      # matches still fails the build.
      - name: Run gitleaks detect
        run: ./gitleaks detect --no-git --source . --verbose --exit-code 1 --redact --config .gitleaks.toml

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets defensively
        shell: bash
        run: |
          for var in TASK_API_KEY API_KEY RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET RESEND_API_KEY RESEND_WEBHOOK_SECRET REPLY_ADDRESS_SECRET GROQ_API_KEY GEMINI_API_KEY OTEL_EXPORTER_OTLP_HEADERS; do
            val="${!var}"
            if [ -n "$val" ]; then echo "::add-mask::$val"; fi
          done

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy app/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    # A real Postgres, not SQLite: the schema uses Postgres enums and JSONB,
    # and the migration is only meaningfully tested against the engine it will
    # actually run on.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: recoup
          POSTGRES_PASSWORD: recoup
          POSTGRES_DB: recoup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://recoup:recoup@localhost:5432/recoup
      APP_ENV: development
      RATE_LIMIT_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Mask secrets defensively
        shell: bash
        run: |
          for var in TASK_API_KEY API_KEY RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET RESEND_API_KEY RESEND_WEBHOOK_SECRET REPLY_ADDRESS_SECRET GROQ_API_KEY GEMINI_API_KEY OTEL_EXPORTER_OTLP_HEADERS; do
            val="${!var}"
            if [ -n "$val" ]; then echo "::add-mask::$val"; fi
          done

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Proves the release command works, and that the baseline reverses --
      # a migration that cannot be rolled back is a migration you cannot deploy
      # with confidence.
      - name: Verify migrations round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: pytest --cov=app --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Mask secrets defensively
        shell: bash
        run: |
          for var in TASK_API_KEY API_KEY RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET RESEND_API_KEY RESEND_WEBHOOK_SECRET REPLY_ADDRESS_SECRET GROQ_API_KEY GEMINI_API_KEY OTEL_EXPORTER_OTLP_HEADERS; do
            val="${!var}"
            if [ -n "$val" ]; then echo "::add-mask::$val"; fi
          done

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify package builds
        run: |
          pip install build setuptools
          python -m build --wheel --no-isolation